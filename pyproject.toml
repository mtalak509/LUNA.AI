[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-agent"
version = "0.1.0"
description = "Мультиагентный сервис для интерактивного анализа и редактирования структурированных JSON-документов"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    # Агентное ядро (LangChain v1 — create_agent живёт в langchain.agents)
    "langchain>=1.3.4,<2.0",
    "langchain-openai>=1.2.2,<2.0",   # vLLM/GPUStack по OpenAI-совместимому протоколу
    "langgraph>=1.2.4,<2.0",          # движок под create_agent + стриминг

    # Веб-слой (MainAgent /message,/events,/hitl,/health + оркестратор)
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "httpx>=0.28.1",                  # async-клиенты к внешним API
    "tenacity>=9.1.4",                # ретраи HTTP-клиентов (exponential backoff)
    "pydantic>=2.13.4",
    "pydantic-settings>=2.0",         # InfraConfig (env, read-only на старте)
    "python-dotenv>=1.2.2",           # загрузка .env (InfraConfig)

    # RAG
    "qdrant-client>=1.18.0",
    "fastembed>=0.8.0",               # локальная векторизация (альтернатива sentence-transformers через endpoint)
]

[project.scripts]
luna = "cli.app:run"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "respx",
    "ruff>=0.15.15",
    "black>=26.5.1",
    "mypy>=2.1.0",
]

[tool.setuptools.packages.find]
include = ["core*", "cli*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# --import-mode=importlib: разрешает одноимённые файлы тестов в разных пакетах
# (tests/agent/test_base.py vs tests/clients/test_base.py) без __init__.py и коллизий импорта.
# Интеграционные тесты (живая сеть) по умолчанию исключены — запуск с `-m integration`.
addopts = "-m 'not integration' --import-mode=importlib"
markers = [
    "integration: тесты против реальных внешних сервисов (сеть); не идут в offline-прогоне",
]
