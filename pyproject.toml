[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-agent"
version = "0.1.1"
description = "LUNA agent service"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    # Agent core (LangChain v1 — create_agent lives in langchain.agents)
    "langchain>=1.3.4,<2.0",
    "langchain-openai>=1.2.2,<2.0",   
    "langgraph>=1.2.4,<2.0",   

    # Web layer (MainAgent /message,/events,/hitl,/health)
    "fastapi>=0.136.3",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.48.0",
    "httpx>=0.28.1",                 
    "tenacity>=9.1.4",           
    "pydantic>=2.13.4",
    "pydantic-settings>=2.0",     
    "python-dotenv>=1.2.2",         

    # RAG
    "qdrant-client>=1.18.0",
    "fastembed>=0.8.0",            
]

[project.scripts]
luna = "cli.app:run"
luna-web = "core.app.server:run"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "respx",
    "ruff>=0.15.15",
    "black>=26.5.1",
    "mypy>=2.1.0",
]

[tool.setuptools.packages.find]
include = ["core*", "cli*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# --import-mode=importlib: allows same-named test files in different packages
# (tests/agent/test_base.py vs tests/clients/test_base.py) without __init__.py or import clashes.
# Integration tests (live network) are excluded by default — run them with `-m integration`.
addopts = "-m 'not integration' --import-mode=importlib"
markers = [
    "integration: tests against real external services (network); skipped in the offline run",
]
